name: RANCAGE 0.1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Verify CLI
        run: |
          cage --version
          cage check examples/hello.cage
          cage run examples/hello.cage
          cage check examples/functions.cage
          cage run examples/functions.cage
          cage check examples/control_flow.cage
          cage run examples/control_flow.cage
