name: RANCAGE Windows Standalone Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/windows-standalone
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "cage_entry.py"
      - "requirements-build.txt"
      - "build-windows.ps1"
      - "test-bundle.ps1"
      - "README-STANDALONE.md"
      - "pyproject.toml"
      - "LICENSE"
      - "licenses/**"
      - "sdk/**"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/standalone-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "cage_entry.py"
      - "requirements-build.txt"
      - "build-windows.ps1"
      - "test-bundle.ps1"
      - "README-STANDALONE.md"
      - "pyproject.toml"
      - "LICENSE"
      - "licenses/**"
      - "sdk/**"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/standalone-windows.yml"

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build and test Windows x64 bundle
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run source test suite
        shell: pwsh
        run: .\run-tests.ps1

      - name: Install build-only dependency
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build standalone executables
        shell: pwsh
        run: .\build-windows.ps1

      - name: Smoke-test bundled executables
        shell: pwsh
        run: .\test-bundle.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cage-windows-x64-standalone-preview
          path: |
            dist/cage-windows-x64.exe
            dist/cage-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
