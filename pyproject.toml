[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rancage-language"
version = "0.2.0a1"
description = "RANCAGE Universal Language reference compiler and bytecode VM"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-RANCAGE-Proprietary"
license-files = [
  "LICENSE",
  "licenses/CORE-PROPRIETARY.txt",
  "licenses/SDK-MIT.txt",
  "THIRD-PARTY-NOTICES.md",
]
authors = [{ name = "henxnomercy" }]
keywords = ["programming-language", "compiler", "virtual-machine", "bytecode"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Other",
  "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.scripts]
cage = "rancage.cli:main"
rancage = "rancage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
