[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rancage-language"
version = "0.2.0a1"
description = "RANCAGE Universal Language reference compiler and bytecode VM"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "licenses/CORE-PROPRIETARY.txt" }
authors = [{ name = "RANCAGE Project" }]
keywords = ["programming-language", "compiler", "virtual-machine", "bytecode"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Other",
  "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.scripts]
cage = "rancage.cli:main"
rancage = "rancage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
